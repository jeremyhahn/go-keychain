version: "3.8"

services:
  vfido2-test:
    build:
      context: ../../..
      dockerfile: test/integration/vfido2/Dockerfile
    privileged: true
    devices:
      - /dev/uhid:/dev/uhid
    cap_add:
      - SYS_ADMIN
    volumes:
      - /tmp/vfido2-test:/var/lib/vfido2
    environment:
      - CGO_ENABLED=1
      - GOOS=linux
    command: ["go", "test", "-v", "-tags=integration,linux", "-timeout=5m", "./test/integration/vfido2/..."]

  # Service for running the virtual FIDO2 device daemon
  vfido2-daemon:
    build:
      context: ../../..
      dockerfile: test/integration/vfido2/Dockerfile
    privileged: true
    devices:
      - /dev/uhid:/dev/uhid
    cap_add:
      - SYS_ADMIN
    volumes:
      - /tmp/vfido2-daemon:/var/lib/vfido2
    environment:
      - CGO_ENABLED=1
      - GOOS=linux
    command: ["/usr/local/bin/vfido2", "-storage", "file", "-storage-path", "/var/lib/vfido2", "-log-level", "debug"]
    profiles:
      - daemon

  # Test with verbose output and race detector
  vfido2-test-race:
    build:
      context: ../../..
      dockerfile: test/integration/vfido2/Dockerfile
    privileged: true
    devices:
      - /dev/uhid:/dev/uhid
    cap_add:
      - SYS_ADMIN
    volumes:
      - /tmp/vfido2-test-race:/var/lib/vfido2
    environment:
      - CGO_ENABLED=1
      - GOOS=linux
    command: ["go", "test", "-v", "-race", "-tags=integration,linux", "-timeout=10m", "./test/integration/vfido2/..."]
    profiles:
      - race
