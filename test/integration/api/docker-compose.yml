services:
  # Keystore server with all protocols enabled
  xkms-server:
    build:
      context: ../../..
      dockerfile: Dockerfile
      additional_contexts:
        go-qrdb: ../../../../go-qrdb
        go-quicraft: ../../../../go-quicraft
      args:
        - VERSION=${VERSION:-0.0.1-alpha}
    image: go-xkms-integration:latest
    container_name: xkms-integration-server
    # Ports are exposed but NOT published to the host to avoid conflicts
    # with the devcontainer. Test containers communicate via the Docker
    # network using the container name (xkms-server:8443, etc.).
    expose:
      - "8443"       # REST API
      - "9443"       # gRPC
      - "8444/udp"   # QUIC (UDP)
      - "8444/tcp"   # QUIC fallback (TCP)
      - "9444"       # MCP
      - "9090"       # Metrics
    # Required for QUIC UDP buffer settings
    privileged: true
    volumes:
      - xkms-data:/data
      - xkms-socket:/var/run/xkms
      - xkms-certs:/etc/xkms/certs
      - ./config.test.yaml:/etc/xkms/xkmsd.yaml
      - ./scripts:/scripts:ro
    environment:
      - XKMS_CONFIG=/etc/xkms/xkmsd.yaml
      - KEYSTORE_LOG_LEVEL=debug
      - KEYSTORE_DATA_DIR=/data
      # TPM configuration
      - TPM_DEVICE_PATH=tcp://swtpm:2321
      - TPM_USE_SIMULATOR=true
      # PKCS#11 configuration
      - PKCS11_LIBRARY=/usr/local/lib/softhsm/libsofthsm2.so
      - SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
      # Certificate directory
      - CERT_DIR=/etc/xkms/certs
    depends_on:
      swtpm:
        condition: service_healthy
      softhsm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--ca-certificate=/etc/xkms/certs/ca.crt", "https://localhost:8443/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - xkms-integration
    # Run as root for integration tests (allows cert generation and UDP buffer config)
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Set UDP buffer sizes for QUIC
        echo "Configuring UDP buffers for QUIC..."
        echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo "Warning: Could not set rmem_max"
        echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo "Warning: Could not set wmem_max"
        cat /proc/sys/net/core/rmem_max || true
        # Ensure directories exist
        mkdir -p /etc/xkms/certs /var/run/xkms /data
        # Generate TLS certificates for QUIC
        echo "Generating TLS certificates..."
        /scripts/generate-test-certs.sh
        # Verify certificates were created
        ls -la /etc/xkms/certs/
        echo "Starting xkms server..."
        exec /app/xkmsd

  # SWTPM TPM 2.0 Simulator
  swtpm:
    build:
      context: ../../../test/docker/swtpm
      dockerfile: Dockerfile
    image: go-xkms-swtpm:latest
    container_name: xkms-integration-swtpm
    expose:
      - "2321"  # TPM command port
      - "2322"  # TPM control port
    volumes:
      - swtpm-data:/var/lib/swtpm/tpmstate
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2321"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xkms-integration

  # SoftHSM PKCS#11 Service
  softhsm:
    build:
      context: ../../../test/docker/softhsm
      dockerfile: Dockerfile
    image: go-xkms-softhsm:latest
    container_name: xkms-integration-softhsm
    volumes:
      - softhsm-tokens:/tokens
    environment:
      - SOFTHSM2_CONF=/home/softhsm/softhsm2.conf
      - PKCS11_LIBRARY=/usr/local/lib/softhsm/libsofthsm2.so
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/local/lib/softhsm/libsofthsm2.so"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - xkms-integration

  # Integration test runner
  integration-tests:
    build:
      context: ../../..
      dockerfile: Dockerfile
      additional_contexts:
        go-qrdb: ../../../../go-qrdb
        go-quicraft: ../../../../go-quicraft
    image: go-xkms-integration:latest
    container_name: xkms-integration-tests
    # Required for QUIC UDP buffer settings
    privileged: true
    user: root
    depends_on:
      xkms-server:
        condition: service_healthy
    volumes:
      - ../../..:/workspace
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - xkms-socket:/var/run/xkms
      - xkms-certs:/etc/xkms/certs:ro
      - cli-build:/app/build
      - go-cache:/root/go
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
      # Server endpoints (all use TLS now)
      - KEYSTORE_UNIX_SOCKET=/var/run/xkms/xkms.sock
      - KEYSTORE_REST_URL=https://xkms-server:8443
      - KEYSTORE_GRPC_ADDR=xkms-server:9443
      - KEYSTORE_QUIC_URL=https://xkms-server:8444
      - KEYSTORE_MCP_ADDR=xkms-server:9444
      - KEYSTORE_CLI_BIN=/app/build/bin/xkmsctl
      # TLS configuration - use CA certificate for proper verification
      - KEYSTORE_TLS_CA=/etc/xkms/certs/ca.crt
      # Test configuration
      - INTEGRATION_TIMEOUT=60s
      - GO_TEST_FLAGS=-v -tags=integration,frost
    working_dir: /workspace
    networks:
      - xkms-integration
    command: >
      sh -c "
      echo 'Configuring UDP buffers for QUIC...' &&
      echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo 'Warning: Could not set rmem_max' &&
      echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo 'Warning: Could not set wmem_max' &&
      echo 'Waiting for server to be ready...' &&
      sleep 5 &&
      echo 'Checking Unix socket...' &&
      ls -la /var/run/xkms/ || true &&
      echo 'Checking TLS certificates...' &&
      ls -la /etc/xkms/certs/ || true &&
      echo 'Building CLI binary...' &&
      mkdir -p /app/build/bin &&
      CGO_ENABLED=0 go build -buildvcs=false -tags=frost -o /app/build/bin/xkmsctl ./cmd/xkmsctl &&
      echo 'Running integration tests...' &&
      go test -v -tags=integration,frost,codec_cbor,codec_json,codec_msgpack ./test/integration/api/... -timeout 15m
      "

volumes:
  xkms-data:
    driver: local
  xkms-socket:
    driver: local
  xkms-certs:
    driver: local
  softhsm-tokens:
    driver: local
  swtpm-data:
    driver: local
  cli-build:
    driver: local
  go-cache:
    driver: local
  go-build-cache:
    driver: local

networks:
  xkms-integration:
    driver: bridge
