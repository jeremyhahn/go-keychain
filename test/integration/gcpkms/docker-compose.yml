services:
  test:
    build:
      context: ../../..
      dockerfile: test/integration/gcpkms/Dockerfile
    environment:
      - GOOGLE_CLOUD_PROJECT=test-project
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
    working_dir: /app

networks:
  default:
    name: xkms-gcpkms-test
