services:
  test:
    build:
      context: ../../..
      dockerfile: test/integration/pkcs11/Dockerfile
    environment:
      - PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so
      - PKCS11_TOKEN_LABEL=test-token
      - PKCS11_PIN=1234
    volumes:
      - ../../..:/app
      # Sibling module mounts (for go.mod replace directives)
      - ../../../../go-qrdb:/go-qrdb:cached
      - ../../../../go-quicraft:/go-quicraft:cached
      - softhsm-data:/var/lib/softhsm
    working_dir: /app

volumes:
  softhsm-data:

networks:
  default:
    name: xkms-pkcs11-test
