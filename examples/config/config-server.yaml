# Example configuration for unified go-xkms server
# Supports all protocols: Unix socket (local), REST, gRPC, QUIC, MCP
#
# By default, xkmsd only listens on Unix socket for local IPC.
# This example enables all protocols for demonstration purposes.

server:
  host: 0.0.0.0
  rest_port: 8443
  grpc_port: 9443
  quic_port: 8444
  mcp_port: 9444

# Protocol settings
# Unix socket is enabled by default for local CLI communication.
# Enable network protocols only when remote access is required.
protocols:
  unix: true    # Local Unix socket (default: true)
  rest: true    # REST/HTTP API (enable for remote access)
  grpc: true    # gRPC API (enable for remote access)
  quic: true    # QUIC/HTTP3 API (enable for remote access)
  mcp: true     # MCP JSON-RPC API (enable for AI/LLM integration)

# Unix socket configuration
unix:
  socket_path: /var/run/xkms/xkms.sock
  socket_mode: "0660"

logging:
  level: info  # debug, info, warn, error
  format: json # json, text

tls:
  enabled: true
  cert_file: /etc/xkms/server.crt
  key_file: /etc/xkms/server.key
  ca_file: /etc/xkms/ca.crt

  # Client certificate verification (mTLS)
  client_auth: require_and_verify  # none, request, require, verify, require_and_verify
  client_cas:
    - /etc/xkms/client-ca.crt

  # TLS version
  min_version: TLS1.2
  max_version: TLS1.3
  prefer_server_ciphers: true

auth:
  enabled: true
  type: mtls  # noop, mtls, jwt, adaptive
  mtls: true

ratelimit:
  enabled: true
  requests_per_min: 1000

metrics:
  enabled: true
  path: /metrics
  port: 9090

health:
  enabled: true
  path: /health

storage:
  backend: file
  path: /var/lib/xkms/metadata

# Default backend for key operations
default_backend: pkcs8

backends:
  pkcs8:
    enabled: true
    path: /var/lib/xkms/keys

