<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAuthn Example - go-xkms</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .status.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .status.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .status.info {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }
        .status .error-hint {
            display: block;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(198, 40, 40, 0.2);
            font-style: italic;
            font-size: 13px;
        }
        .user-info {
            margin-top: 24px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }
        .user-info.show {
            display: block;
        }
        .user-info h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 18px;
        }
        .user-info p {
            color: #666;
            margin: 8px 0;
            font-size: 14px;
        }
        .user-info strong {
            color: #333;
        }
        .logout-btn {
            margin-top: 16px;
            padding: 10px 20px;
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover {
            background: #ff1744;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #999;
            font-size: 14px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .divider::before {
            margin-right: 16px;
        }
        .divider::after {
            margin-left: 16px;
        }
        .discoverable-login {
            text-align: center;
        }
        .discoverable-login button {
            background: none;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 24px;
        }
        .discoverable-login button:hover {
            background: #667eea;
            color: white;
        }
        .footer {
            margin-top: 32px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            margin-left: 8px;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }
        .diagnostics {
            margin-top: 24px;
        }
        .diagnostics summary {
            cursor: pointer;
            color: #888;
            font-size: 13px;
            padding: 8px 0;
            user-select: none;
        }
        .diagnostics summary:hover {
            color: #555;
        }
        .diagnostics .diag-content {
            margin-top: 8px;
            padding: 16px;
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
            line-height: 1.6;
            color: #444;
        }
        .diagnostics .diag-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 12px;
        }
        .diagnostics .diag-row:last-child {
            border-bottom: none;
        }
        .diagnostics .diag-label {
            font-weight: 600;
            color: #555;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .diagnostics .diag-value {
            text-align: right;
            word-break: break-all;
        }
        .diagnostics .diag-ok {
            color: #2e7d32;
        }
        .diagnostics .diag-warn {
            color: #e65100;
        }
        .diagnostics .diag-fail {
            color: #c62828;
        }
        .diagnostics .diag-ua {
            font-size: 11px;
            color: #888;
            word-break: break-word;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebAuthn Demo</h1>
        <p class="subtitle">Passwordless authentication with go-xkms</p>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="user@example.com" autocomplete="email webauthn">
        </div>

        <div class="form-group">
            <label for="displayName">Display Name (for registration)</label>
            <input type="text" id="displayName" placeholder="John Doe">
        </div>

        <div class="buttons">
            <button class="btn-primary" id="registerBtn" onclick="register()">Register</button>
            <button class="btn-secondary" id="loginBtn" onclick="login()">Login</button>
        </div>

        <div class="divider">or</div>

        <div class="discoverable-login">
            <button id="discoverableBtn" onclick="discoverableLogin()">
                Login with Passkey
            </button>
        </div>

        <div class="status" id="status"></div>

        <div class="user-info" id="userInfo">
            <h3>Authenticated</h3>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>User ID:</strong> <span id="userId"></span></p>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <details class="diagnostics" id="diagnostics">
            <summary>Diagnostics</summary>
            <div class="diag-content" id="diagContent">
                <div class="diag-row">
                    <span class="diag-label">Loading...</span>
                </div>
            </div>
        </details>

        <div class="footer">
            Powered by <a href="https://github.com/jeremyhahn/go-xkms" target="_blank">go-xkms</a>
        </div>
    </div>

    <script>
        // Error hint map for DOMException error names
        var errorHints = {
            'NotAllowedError': 'User cancelled, timed out, or authenticator does not support the requested operation. Try a different security key.',
            'SecurityError': 'Origin/RP ID mismatch or insecure context. Check that RPID matches your domain.',
            'InvalidStateError': 'Credential already exists on this authenticator. Try logging in instead.',
            'ConstraintError': 'Authenticator cannot meet requirements. Try disabling user verification or using a different authenticator.',
            'AbortError': 'Operation was aborted. Try again.',
            'NotSupportedError': 'Browser/authenticator does not support this operation.'
        };

        // Convert an ArrayBuffer to a hex string for readable logging
        function bufferToHex(buffer) {
            var bytes = new Uint8Array(buffer);
            var hex = '';
            for (var i = 0; i < bytes.length; i++) {
                hex += bytes[i].toString(16).padStart(2, '0');
            }
            return hex;
        }

        // Produce a JSON-safe representation of publicKey options,
        // converting ArrayBuffer/Uint8Array fields to hex strings.
        function serializeOptionsForLog(opts) {
            return JSON.parse(JSON.stringify(opts, function(key, value) {
                if (value instanceof ArrayBuffer) {
                    return '(hex) ' + bufferToHex(value);
                }
                if (value instanceof Uint8Array) {
                    return '(hex) ' + bufferToHex(value.buffer);
                }
                return value;
            }));
        }

        // Build a detailed error message from a caught error, including
        // DOMException fields and a contextual hint when available.
        function formatDetailedError(prefix, error) {
            var message = prefix;

            if (error instanceof DOMException) {
                message += ' [DOMException: ' + error.name + '] - ' + error.message;
                var hint = errorHints[error.name];
                if (hint) {
                    return { message: message, hint: hint };
                }
            } else if (error && error.name) {
                message += ' [' + error.name + '] - ' + error.message;
                var hint = errorHints[error.name];
                if (hint) {
                    return { message: message, hint: hint };
                }
            } else {
                message += ' ' + (error.message || String(error));
            }

            return { message: message, hint: null };
        }

        // Log full error details to the console for debugging
        function logErrorDetails(context, error) {
            console.log('Error details (' + context + '):', {
                name: error.name || 'N/A',
                message: error.message || 'N/A',
                isDOMException: error instanceof DOMException,
                cause: error.cause || 'N/A',
                stack: error.stack || 'N/A',
                raw: error
            });
        }

        // Base64URL encoding/decoding utilities
        function base64URLEncode(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }

        function base64URLDecode(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            return Uint8Array.from(atob(str), c => c.charCodeAt(0));
        }

        function showStatus(message, type, hint) {
            var status = document.getElementById('status');
            status.className = 'status ' + type;
            if (hint) {
                status.innerHTML = '';
                var msgNode = document.createTextNode(message);
                status.appendChild(msgNode);
                var hintSpan = document.createElement('span');
                hintSpan.className = 'error-hint';
                hintSpan.textContent = 'Hint: ' + hint;
                status.appendChild(hintSpan);
            } else {
                status.textContent = message;
            }
        }

        function setLoading(buttonId, loading) {
            var btn = document.getElementById(buttonId);
            if (loading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function showUserInfo(email, userId) {
            document.getElementById('userEmail').textContent = email;
            document.getElementById('userId').textContent = userId;
            document.getElementById('userInfo').classList.add('show');
        }

        function logout() {
            document.getElementById('userInfo').classList.remove('show');
            document.getElementById('status').className = 'status';
            document.getElementById('email').value = '';
            document.getElementById('displayName').value = '';
        }

        async function register() {
            var email = document.getElementById('email').value;
            var displayName = document.getElementById('displayName').value || email.split('@')[0];

            if (!email) {
                showStatus('Please enter an email address', 'error');
                return;
            }

            setLoading('registerBtn', true);
            showStatus('Starting registration...', 'info');

            try {
                // Step 1: Begin registration
                var beginResponse = await fetch('/api/v1/webauthn/registration/begin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, display_name: displayName })
                });

                if (!beginResponse.ok) {
                    var serverError = await beginResponse.json();
                    throw new Error(serverError.error || 'Failed to begin registration');
                }

                var sessionId = beginResponse.headers.get('X-Session-Id');
                var options = await beginResponse.json();

                console.log('Server options received (register):', JSON.stringify(options, null, 2));

                // Convert base64url to ArrayBuffer
                options.publicKey.challenge = base64URLDecode(options.publicKey.challenge);
                options.publicKey.user.id = base64URLDecode(options.publicKey.user.id);

                if (options.publicKey.excludeCredentials) {
                    options.publicKey.excludeCredentials = options.publicKey.excludeCredentials.map(function(cred) {
                        return Object.assign({}, cred, { id: base64URLDecode(cred.id) });
                    });
                }

                console.log('Options after decode (register):', serializeOptionsForLog(options));

                showStatus('Please interact with your authenticator...', 'info');

                // Step 2: Create credential
                var credential = await navigator.credentials.create(options);

                console.log('Credential created:', {
                    id: credential.id,
                    type: credential.type,
                    transports: credential.response.getTransports ? credential.response.getTransports() : 'N/A'
                });

                // Step 3: Finish registration
                var attestationResponse = {
                    id: credential.id,
                    rawId: base64URLEncode(credential.rawId),
                    type: credential.type,
                    response: {
                        attestationObject: base64URLEncode(credential.response.attestationObject),
                        clientDataJSON: base64URLEncode(credential.response.clientDataJSON)
                    }
                };

                // Add transports if available
                if (credential.response.getTransports) {
                    attestationResponse.response.transports = credential.response.getTransports();
                }

                var finishResponse = await fetch('/api/v1/webauthn/registration/finish', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Id': sessionId
                    },
                    body: JSON.stringify(attestationResponse)
                });

                if (!finishResponse.ok) {
                    var finishError = await finishResponse.json();
                    throw new Error(finishError.error || 'Failed to finish registration');
                }

                var result = await finishResponse.json();
                console.log('Registration complete:', result);
                showStatus('Registration successful! You can now login with your passkey.', 'success');

            } catch (error) {
                logErrorDetails('register', error);
                var formatted = formatDetailedError('Registration failed:', error);
                showStatus(formatted.message, 'error', formatted.hint);
            } finally {
                setLoading('registerBtn', false);
            }
        }

        async function login() {
            var email = document.getElementById('email').value;

            if (!email) {
                showStatus('Please enter an email address', 'error');
                return;
            }

            setLoading('loginBtn', true);
            showStatus('Starting login...', 'info');

            try {
                // Step 1: Begin login
                var beginResponse = await fetch('/api/v1/webauthn/login/begin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (!beginResponse.ok) {
                    var serverError = await beginResponse.json();
                    throw new Error(serverError.error || 'Failed to begin login');
                }

                var sessionId = beginResponse.headers.get('X-Session-Id');
                var options = await beginResponse.json();

                console.log('Server options received (login):', JSON.stringify(options, null, 2));

                // Convert base64url to ArrayBuffer
                options.publicKey.challenge = base64URLDecode(options.publicKey.challenge);

                if (options.publicKey.allowCredentials) {
                    options.publicKey.allowCredentials = options.publicKey.allowCredentials.map(function(cred) {
                        return Object.assign({}, cred, { id: base64URLDecode(cred.id) });
                    });
                }

                console.log('Options after decode (login):', serializeOptionsForLog(options));

                showStatus('Please interact with your authenticator...', 'info');

                // Step 2: Get assertion
                var assertion = await navigator.credentials.get(options);

                console.log('Assertion received:', {
                    id: assertion.id,
                    type: assertion.type,
                    hasUserHandle: !!assertion.response.userHandle
                });

                // Step 3: Finish login
                var assertionResponse = {
                    id: assertion.id,
                    rawId: base64URLEncode(assertion.rawId),
                    type: assertion.type,
                    response: {
                        authenticatorData: base64URLEncode(assertion.response.authenticatorData),
                        clientDataJSON: base64URLEncode(assertion.response.clientDataJSON),
                        signature: base64URLEncode(assertion.response.signature)
                    }
                };

                if (assertion.response.userHandle) {
                    assertionResponse.response.userHandle = base64URLEncode(assertion.response.userHandle);
                }

                var finishResponse = await fetch('/api/v1/webauthn/login/finish', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Id': sessionId
                    },
                    body: JSON.stringify(assertionResponse)
                });

                if (!finishResponse.ok) {
                    var finishError = await finishResponse.json();
                    throw new Error(finishError.error || 'Failed to finish login');
                }

                var result = await finishResponse.json();
                console.log('Login complete:', result);
                showStatus('Login successful!', 'success');
                showUserInfo(email, result.user_id || 'N/A');

            } catch (error) {
                logErrorDetails('login', error);
                var formatted = formatDetailedError('Login failed:', error);
                showStatus(formatted.message, 'error', formatted.hint);
            } finally {
                setLoading('loginBtn', false);
            }
        }

        async function discoverableLogin() {
            setLoading('discoverableBtn', true);
            showStatus('Starting discoverable login...', 'info');

            try {
                // Step 1: Begin login without email (discoverable)
                var beginResponse = await fetch('/api/v1/webauthn/login/begin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                if (!beginResponse.ok) {
                    var serverError = await beginResponse.json();
                    throw new Error(serverError.error || 'Failed to begin login');
                }

                var sessionId = beginResponse.headers.get('X-Session-Id');
                var options = await beginResponse.json();

                console.log('Server options received (discoverable):', JSON.stringify(options, null, 2));

                // Convert base64url to ArrayBuffer
                options.publicKey.challenge = base64URLDecode(options.publicKey.challenge);

                console.log('Options after decode (discoverable):', serializeOptionsForLog(options));

                showStatus('Please select a passkey...', 'info');

                // Step 2: Get assertion (browser will show available passkeys)
                var assertion = await navigator.credentials.get(options);

                console.log('Assertion received (discoverable):', {
                    id: assertion.id,
                    type: assertion.type,
                    hasUserHandle: !!assertion.response.userHandle
                });

                // Step 3: Finish login
                var assertionResponse = {
                    id: assertion.id,
                    rawId: base64URLEncode(assertion.rawId),
                    type: assertion.type,
                    response: {
                        authenticatorData: base64URLEncode(assertion.response.authenticatorData),
                        clientDataJSON: base64URLEncode(assertion.response.clientDataJSON),
                        signature: base64URLEncode(assertion.response.signature)
                    }
                };

                if (assertion.response.userHandle) {
                    assertionResponse.response.userHandle = base64URLEncode(assertion.response.userHandle);
                }

                var finishResponse = await fetch('/api/v1/webauthn/login/finish', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Id': sessionId
                    },
                    body: JSON.stringify(assertionResponse)
                });

                if (!finishResponse.ok) {
                    var finishError = await finishResponse.json();
                    throw new Error(finishError.error || 'Failed to finish login');
                }

                var result = await finishResponse.json();
                console.log('Discoverable login complete:', result);
                showStatus('Login successful!', 'success');
                showUserInfo(result.email || 'Unknown', result.user_id || 'N/A');

            } catch (error) {
                logErrorDetails('discoverableLogin', error);
                var formatted = formatDetailedError('Login failed:', error);
                showStatus(formatted.message, 'error', formatted.hint);
            } finally {
                setLoading('discoverableBtn', false);
            }
        }

        // Populate diagnostics panel on page load
        async function populateDiagnostics() {
            var container = document.getElementById('diagContent');
            var rows = [];

            // Browser / platform info
            rows.push({ label: 'User Agent', value: navigator.userAgent, css: 'diag-ua' });

            // WebAuthn API availability
            var webauthnSupported = !!window.PublicKeyCredential;
            rows.push({
                label: 'WebAuthn API',
                value: webauthnSupported ? 'Supported' : 'Not supported',
                css: webauthnSupported ? 'diag-ok' : 'diag-fail'
            });

            // Origin
            rows.push({ label: 'Origin', value: window.location.origin, css: '' });

            // Secure context
            var isSecure = window.isSecureContext;
            rows.push({
                label: 'Secure Context',
                value: isSecure ? 'Yes' : 'No',
                css: isSecure ? 'diag-ok' : 'diag-fail'
            });

            // Platform authenticator availability
            if (webauthnSupported && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
                try {
                    var platformAvailable = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                    rows.push({
                        label: 'Platform Authenticator',
                        value: platformAvailable ? 'Available' : 'Not available',
                        css: platformAvailable ? 'diag-ok' : 'diag-warn'
                    });
                } catch (e) {
                    rows.push({
                        label: 'Platform Authenticator',
                        value: 'Check failed: ' + e.message,
                        css: 'diag-fail'
                    });
                }
            } else {
                rows.push({
                    label: 'Platform Authenticator',
                    value: 'API not available',
                    css: 'diag-warn'
                });
            }

            // Conditional mediation (passkey autofill) availability
            if (webauthnSupported && PublicKeyCredential.isConditionalMediationAvailable) {
                try {
                    var conditionalAvailable = await PublicKeyCredential.isConditionalMediationAvailable();
                    rows.push({
                        label: 'Conditional Mediation',
                        value: conditionalAvailable ? 'Available' : 'Not available',
                        css: conditionalAvailable ? 'diag-ok' : 'diag-warn'
                    });
                } catch (e) {
                    rows.push({
                        label: 'Conditional Mediation',
                        value: 'Check failed: ' + e.message,
                        css: 'diag-fail'
                    });
                }
            } else {
                rows.push({
                    label: 'Conditional Mediation',
                    value: 'API not available',
                    css: 'diag-warn'
                });
            }

            // Render rows
            container.innerHTML = '';
            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];
                var div = document.createElement('div');
                div.className = 'diag-row';
                var labelSpan = document.createElement('span');
                labelSpan.className = 'diag-label';
                labelSpan.textContent = row.label;
                var valueSpan = document.createElement('span');
                valueSpan.className = 'diag-value ' + row.css;
                valueSpan.textContent = row.value;
                div.appendChild(labelSpan);
                div.appendChild(valueSpan);
                container.appendChild(div);
            }

            // Log diagnostics summary to console
            console.log('WebAuthn Diagnostics:', rows.map(function(r) {
                return r.label + ': ' + r.value;
            }).join(', '));
        }

        // Check WebAuthn support and disable buttons if unavailable
        if (!window.PublicKeyCredential) {
            showStatus('WebAuthn is not supported in this browser', 'error');
            document.querySelectorAll('button').forEach(function(btn) { btn.disabled = true; });
        }

        populateDiagnostics();
    </script>
</body>
</html>
