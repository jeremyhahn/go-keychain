services:
  # Unified server (all protocols)
  xkms-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    image: go-xkms/server:${VERSION:-latest}
    container_name: xkms-server
    ports:
      - "8443:8443"   # REST
      - "9443:9443"   # gRPC
      - "8444:8444/udp" # QUIC
      - "9444:9444"   # MCP
    volumes:
      - xkms-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # REST-only server
  xkms-rest:
    build:
      context: .
      dockerfile: Dockerfile.rest
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    image: go-xkms/rest:${VERSION:-latest}
    container_name: xkms-rest
    ports:
      - "8445:8443"
    volumes:
      - xkms-rest-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config-rest.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - rest-only

  # gRPC-only server
  xkms-grpc:
    build:
      context: .
      dockerfile: Dockerfile.grpc
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    image: go-xkms/grpc:${VERSION:-latest}
    container_name: xkms-grpc
    ports:
      - "9445:9443"
    volumes:
      - xkms-grpc-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config-grpc.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 9443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - grpc-only

  # QUIC-only server
  xkms-quic:
    build:
      context: .
      dockerfile: Dockerfile.quic
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    image: go-xkms/quic:${VERSION:-latest}
    container_name: xkms-quic
    ports:
      - "8446:8444/udp"
    volumes:
      - xkms-quic-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config-quic.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -anu | grep 8444 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - quic-only

  # MCP-only server
  xkms-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    image: go-xkms/mcp:${VERSION:-latest}
    container_name: xkms-mcp
    ports:
      - "9446:9444"
    volumes:
      - xkms-mcp-data:/var/lib/xkms
      - ./configs:/etc/xkms:ro
    environment:
      - KEYSTORE_CONFIG=/etc/xkms/config-mcp.yaml
    restart: unless-stopped
    networks:
      - xkms-net
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 9444 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - mcp-only

networks:
  xkms-net:
    driver: bridge

volumes:
  xkms-data:
    driver: local
  xkms-rest-data:
    driver: local
  xkms-grpc-data:
    driver: local
  xkms-quic-data:
    driver: local
  xkms-mcp-data:
    driver: local
