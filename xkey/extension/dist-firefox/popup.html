<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>xKey AutoFill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      min-height: 200px;
      max-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fff;
    }
    .header {
      padding: 12px 16px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-icon svg {
      width: 20px;
      height: 20px;
    }
    .header-title { font-weight: 600; font-size: 15px; }
    .header-domain { font-size: 12px; color: #666; }
    .status-bar {
      padding: 8px 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.locked { background: #f59e0b; }
    .status-dot.disconnected { background: #ef4444; }
    .credentials-list {
      overflow-y: auto;
      max-height: 300px;
    }
    .credential-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .credential-item:hover { background: #f5f5f5; }
    .cred-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .cred-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cred-username {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cred-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .btn {
      padding: 4px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .btn:hover { background: #f0f0f0; }
    .btn-fill {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    .btn-fill:hover { background: #1d4ed8; }
    .totp-section {
      padding: 10px 16px;
      background: #fafafa;
      border-top: 1px solid #e0e0e0;
    }
    .totp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .totp-code {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 4px;
    }
    .totp-timer { font-size: 12px; color: #666; }
    .totp-issuer { font-size: 11px; color: #999; margin-top: 4px; }
    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: #999;
    }
    .error-state {
      padding: 12px 16px;
      background: #fef2f2;
      color: #dc2626;
      font-size: 13px;
      border-bottom: 1px solid #fecaca;
    }
    .pairing-section {
      padding: 16px;
      background: #f0f4ff;
      border-top: 1px solid #c7d2fe;
    }
    .pairing-header {
      font-weight: 600;
      font-size: 15px;
      color: #1e40af;
      margin-bottom: 8px;
    }
    .pairing-info {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 12px;
    }
    .pairing-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pairing-input-row input {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 18px;
      letter-spacing: 4px;
      text-align: center;
      border: 2px solid #c7d2fe;
      border-radius: 6px;
      outline: none;
    }
    .pairing-input-row input:focus {
      border-color: #4f46e5;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
      font-weight: 500;
      padding: 8px 16px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #4338ca; }
    .error-text {
      color: #dc2626;
      font-size: 12px;
      margin-top: 8px;
    }
    .success-text {
      color: #16a34a;
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
      </svg>
    </div>
    <div>
      <div class="header-title">xKey AutoFill</div>
      <div class="header-domain" id="current-domain">-</div>
    </div>
  </div>
  <div class="status-bar" id="status-bar">
    <span class="status-dot disconnected" id="status-dot"></span>
    <span id="status-text">Connecting...</span>
  </div>
  <div id="error-container"></div>
  <div class="credentials-list" id="credentials-list"></div>
  <div class="totp-section" id="totp-section" style="display:none">
    <div class="totp-row">
      <div>
        <div class="totp-code" id="totp-code">------</div>
        <div class="totp-timer" id="totp-timer">--s remaining</div>
        <div class="totp-issuer" id="totp-issuer"></div>
      </div>
      <button class="btn" id="totp-copy" title="Copy TOTP code">Copy</button>
    </div>
  </div>
  <div class="pairing-section" id="pairing-section" style="display:none">
    <div class="pairing-header">Extension Pairing</div>
    <div class="pairing-info">Enter the 6-digit code shown in xKey</div>
    <div class="pairing-input-row">
      <input type="text" id="pairing-code" maxlength="6" pattern="[0-9]*"
             inputmode="numeric" placeholder="000000" autocomplete="off">
      <button class="btn btn-primary" id="pairing-submit">Pair</button>
    </div>
    <div id="pairing-error" class="error-text" style="display:none"></div>
    <button class="btn" id="pairing-retry" style="display:none">Retry Connection</button>
    <div id="pairing-success" class="success-text" style="display:none">
      Paired successfully!
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
