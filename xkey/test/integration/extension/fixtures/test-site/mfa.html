<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Site - MFA Verification</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: bold; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; text-align: center; letter-spacing: 4px; }
        button { padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Two-Factor Authentication</h1>
    <p>Enter the 6-digit code from your authenticator app.</p>
    <form id="mfaForm" action="/verify-mfa" method="POST">
        <label for="totp-code">Verification Code</label>
        <input type="text" id="totp-code" name="totp_code" autocomplete="one-time-code"
               maxlength="6" pattern="[0-9]{6}" placeholder="000000" inputmode="numeric">
        <button type="submit">Verify</button>
    </form>
</body>
</html>
