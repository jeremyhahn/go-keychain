services:
  xkey-test:
    build:
      context: ../../..
      dockerfile: test/integration/xkey/Dockerfile
    privileged: true
    devices:
      - /dev/uhid:/dev/uhid
    cap_add:
      - SYS_ADMIN
    volumes:
      - /tmp/xkey-test:/var/lib/xkey
    environment:
      - CGO_ENABLED=1
      - GOOS=linux
    command: ["go", "test", "-v", "-tags=integration,linux", "-timeout=5m", "./test/integration/xkey/..."]

  # Service for running the virtual FIDO2 device daemon
  xkey-daemon:
    build:
      context: ../../..
      dockerfile: test/integration/xkey/Dockerfile
    privileged: true
    devices:
      - /dev/uhid:/dev/uhid
    cap_add:
      - SYS_ADMIN
    volumes:
      - /tmp/xkey-daemon:/var/lib/xkey
    environment:
      - CGO_ENABLED=1
      - GOOS=linux
    command: ["/usr/local/bin/xkey", "-storage", "file", "-storage-path", "/var/lib/xkey", "-log-level", "debug"]
    profiles:
      - daemon

  # Test with verbose output and race detector
  xkey-test-race:
    build:
      context: ../../..
      dockerfile: test/integration/xkey/Dockerfile
    privileged: true
    devices:
      - /dev/uhid:/dev/uhid
    cap_add:
      - SYS_ADMIN
    volumes:
      - /tmp/xkey-test-race:/var/lib/xkey
    environment:
      - CGO_ENABLED=1
      - GOOS=linux
    command: ["go", "test", "-v", "-race", "-tags=integration,linux", "-timeout=10m", "./test/integration/xkey/..."]
    profiles:
      - race
